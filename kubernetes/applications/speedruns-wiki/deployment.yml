apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedruns-wiki
  labels:
    app: speedruns-wiki
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: speedruns-wiki
  replicas: 1
  template:
    metadata:
      labels:
        app: speedruns-wiki
    spec:
      containers:
        - name: speedruns-wiki
          image: ghcr.io/rekyuu/speedruns-wiki:1.2.0
          imagePullPolicy: Always
        - name: anubis
          image: ghcr.io/techarohq/anubis:latest
          imagePullPolicy: Always
          env:
            - name: "BIND"
              value: ":8080"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: speedruns-wiki-anubis-key
                  key: ED25519_PRIVATE_KEY_HEX
            - name: "METRICS_BIND"
              value: ":9090"
            - name: "SERVE_ROBOTS_TXT"
              value: "true"
            - name: "TARGET"
              value: "http://localhost:80"
            - name: "OG_PASSTHROUGH"
              value: "true"
            - name: "OG_EXPIRY_TIME"
              value: "24h"
          resources:
            limits:
              cpu: 750m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: speedruns-wiki
spec:
  type: ClusterIP
  ports:
  - name: anubis
    protocol: TCP
    targetPort: 8080
    port: 8080
  selector:
    app: speedruns-wiki
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: speedruns-wiki
spec:
  routes:
    - kind: Rule
      match: Host(`speedruns.wiki`)
      priority: 10
      services:
        - name: speedruns-wiki
          port: 8080